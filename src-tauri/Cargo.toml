[package]
name = "photo-booth"
version = "0.1.0"
description = "Desktop photo booth — pick a layout, snap, send."
authors = ["Photo Booth"]
edition = "2021"

[lib]
name = "photo_booth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
local-ip-address = "0.6"
rand = "0.8"
